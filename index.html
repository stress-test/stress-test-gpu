<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800;900&display=swap');

:root{
  --bg:#04060a;
  --cyan:#00e5ff;
  --magenta:#ff2e63;
  --purple:#7b61ff;
  --green:#00e676;
  --amber:#ffb300;
  --txt:#e8eefb;
  --dim:#7a89a5;
  --line:rgba(0,229,255,0.14);
  --glass:rgba(8,14,24,0.55);
  --mono:'JetBrains Mono','SF Mono','Roboto Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:#04060a;
  color:var(--txt);
  font-family:var(--mono);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}

#bgShader{
  position:fixed;inset:0;
  width:100vw;height:100vh;
  z-index:0;
  pointer-events:none;
  image-rendering:auto;
  filter:blur(0.3px) saturate(1.15);
  opacity:0;
  transition:opacity 1.6s ease;
}
#bgShader.loaded{opacity:1}

.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.055) 3px,rgba(0,0,0,0.055) 3px);
  mix-blend-mode:multiply;opacity:0.7;
}
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:0.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grainShift 0.8s steps(6) infinite;
}
@keyframes grainShift{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-2px,1px)}
  40%{transform:translate(1px,-2px)}
  60%{transform:translate(-1px,2px)}
  80%{transform:translate(2px,-1px)}
}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,
    transparent 15%, rgba(4,6,10,0.3) 60%, rgba(4,6,10,0.95) 100%);
}

canvas#glcanvas{
  position:fixed;top:-10000px;left:-10000px;
  width:1280px;height:720px;pointer-events:none;
}

.stage{
  position:relative;z-index:2;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px 20px;
}
body.debug .stage{
  min-height:auto;justify-content:flex-start;padding-top:60px;
}

.brand{
  font-size:10.5px;letter-spacing:5px;color:var(--dim);
  text-transform:uppercase;margin-bottom:40px;font-weight:500;
  display:flex;align-items:center;gap:12px;
  text-shadow:0 0 20px rgba(0,0,0,0.8);
}
.brand::before,.brand::after{
  content:'';display:block;width:36px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}
.brand .dot{
  width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan),0 0 24px rgba(0,229,255,0.5);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.5;transform:scale(0.85)}
}

.fps-wrap{position:relative;display:flex;flex-direction:column;
  align-items:center;margin-bottom:36px}
.fps-label{
  font-size:10px;letter-spacing:4px;color:var(--dim);
  margin-bottom:6px;font-weight:500;text-transform:uppercase;
  text-shadow:0 0 12px rgba(0,0,0,0.9);
}
.fps-big{
  font-family:var(--mono);font-weight:900;
  font-size:clamp(76px,20vw,180px);
  letter-spacing:-0.06em;line-height:0.9;
  color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:
    0 0 24px rgba(0,229,255,0.9),
    0 0 60px rgba(0,229,255,0.55),
    0 0 110px rgba(123,97,255,0.35),
    0 0 180px rgba(255,46,99,0.18),
    0 4px 30px rgba(0,0,0,0.9);
  transition:color 0.3s,text-shadow 0.3s;
  position:relative;display:inline-block;
}
.fps-big::after{
  content:'';position:absolute;inset:-20% -10%;
  background:radial-gradient(ellipse at center,rgba(0,229,255,0.18),transparent 70%);
  pointer-events:none;z-index:-1;filter:blur(20px);
  animation:fpsGlow 3s ease-in-out infinite;
}
@keyframes fpsGlow{0%,100%{opacity:0.7}50%{opacity:1}}
.fps-big.hot{
  color:#fff;
  text-shadow:
    0 0 24px rgba(255,46,99,0.9),
    0 0 60px rgba(255,46,99,0.55),
    0 0 110px rgba(255,46,99,0.35),
    0 4px 30px rgba(0,0,0,0.9);
}
.fps-unit{
  font-size:11px;letter-spacing:6px;color:var(--dim);
  margin-top:14px;font-weight:500;text-transform:uppercase;
  text-shadow:0 0 12px rgba(0,0,0,0.9);
}

.progress{
  width:min(520px,88vw);height:3px;
  background:rgba(0,229,255,0.08);border-radius:99px;
  overflow:hidden;margin:0 auto 22px;position:relative;
  box-shadow:inset 0 0 8px rgba(0,0,0,0.6);
}
.progress > div{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--purple) 50%,var(--magenta));
  box-shadow:0 0 12px var(--cyan),0 0 24px rgba(123,97,255,0.6),0 0 40px rgba(255,46,99,0.3);
  transition:width 0.25s ease;position:relative;
}
.progress > div::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:40px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
  animation:progressShimmer 1.6s linear infinite;
}
@keyframes progressShimmer{
  from{transform:translateX(-40px)}to{transform:translateX(40px)}
}

.status{
  font-size:12.5px;color:var(--dim);letter-spacing:0.5px;
  text-align:center;min-height:22px;line-height:1.6;
  max-width:560px;margin:0 auto;font-variant-numeric:tabular-nums;
  font-weight:500;text-shadow:0 0 12px rgba(0,0,0,0.9);
}
.status b{color:var(--cyan);font-weight:700}
.status.ok b{color:var(--green)}
.status.err{color:var(--magenta)}
.status.ok{
  color:var(--txt);padding:14px 22px;
  background:rgba(0,230,118,0.06);
  border:1px solid rgba(0,230,118,0.25);
  border-radius:10px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px rgba(0,230,118,0.15);
}

#debugPanels{
  max-width:1100px;margin:40px auto 80px;width:100%;padding:0 16px;
}
#debugPanels.hidden{display:none}
#debugPanels h2{
  font-size:10.5px;color:var(--cyan);margin:32px 0 12px;
  text-transform:uppercase;letter-spacing:3px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  text-shadow:0 0 12px rgba(0,0,0,0.9);
}
#debugPanels h2::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--line),transparent);
}
#deviceInfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
#deviceInfo .kv{
  background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
  box-shadow:0 4px 24px -12px rgba(0,229,255,0.25),inset 0 1px 0 rgba(255,255,255,0.03);
}
#deviceInfo .k{
  font-size:9.5px;text-transform:uppercase;letter-spacing:2px;
  color:var(--dim);margin-bottom:5px;
}
#deviceInfo .v{font-size:13px;font-weight:600;word-break:break-word;line-height:1.35}
#deviceInfo .v.ip{
  color:var(--amber);font-family:var(--mono);
  text-shadow:0 0 12px rgba(255,179,0,0.4);
}
#detailInfo details{
  background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;overflow:hidden;
  box-shadow:0 4px 24px -12px rgba(0,229,255,0.15);
}
#detailInfo details > summary{
  padding:12px 16px;cursor:pointer;font-weight:700;font-size:12.5px;
  color:var(--cyan);list-style:none;display:flex;
  justify-content:space-between;align-items:center;letter-spacing:0.5px;
}
#detailInfo details > summary::-webkit-details-marker{display:none}
#detailInfo details > summary::after{
  content:'▸';color:var(--dim);font-size:16px;transition:transform 0.2s;
}
#detailInfo details[open] > summary::after{transform:rotate(90deg)}
#detailInfo details > summary:hover{background:rgba(0,229,255,0.04)}
#detailInfo .detail-grid{padding:8px 16px 14px;border-top:1px solid var(--line)}
#detailInfo .detail-row{
  display:grid;grid-template-columns:minmax(140px,34%) 1fr;
  gap:10px;font-size:12px;padding:7px 0;
  border-bottom:1px solid rgba(0,229,255,0.06);
}
#detailInfo .detail-row:last-child{border-bottom:none}
#detailInfo .dk{color:var(--dim);font-size:11px;word-break:break-word}
#detailInfo .dv{
  font-weight:500;word-break:break-all;
  font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--txt);
}
#debugPanels table{
  width:100%;border-collapse:collapse;font-size:12px;
  background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 4px 24px -12px rgba(0,229,255,0.15);
}
#debugPanels th{
  background:rgba(0,229,255,0.05);color:var(--dim);
  font-size:9.5px;padding:12px 10px;text-align:left;
  text-transform:uppercase;letter-spacing:2px;font-weight:700;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
#debugPanels td{padding:11px 10px;border-bottom:1px solid rgba(0,229,255,0.06)}
#debugPanels tbody tr:last-child td{border-bottom:none}
#debugPanels tbody tr:hover{background:rgba(0,229,255,0.04)}
#debugPanels td.rank{font-weight:900;text-align:center;width:46px;color:var(--amber)}
#debugPanels td.fps{
  color:var(--cyan);font-weight:800;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(0,229,255,0.5);
}
#debugPanels td.score{
  color:var(--amber);font-weight:800;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,179,0,0.4);
}
#debugPanels td.gpu{color:var(--dim);font-size:11px;max-width:230px}
#debugPanels td.ip{font-family:var(--mono);font-size:11px;color:var(--amber)}
#debugPanels td.date{color:var(--dim);font-size:10.5px;white-space:nowrap}
#debugJson{
  background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;
  padding:16px;font-size:10.5px;color:var(--dim);
  white-space:pre-wrap;word-break:break-all;
  max-height:400px;overflow:auto;font-family:var(--mono);
  line-height:1.5;box-shadow:0 4px 24px -12px rgba(0,229,255,0.15);
}
#rerunBtn{
  margin-top:24px;padding:14px 28px;
  background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(123,97,255,0.15));
  border:1px solid rgba(0,229,255,0.4);border-radius:10px;
  font:inherit;font-family:var(--mono);font-weight:700;
  font-size:12.5px;letter-spacing:1px;color:var(--cyan);
  cursor:pointer;text-transform:uppercase;transition:all 0.2s;
  box-shadow:0 0 20px rgba(0,229,255,0.15),inset 0 0 12px rgba(0,229,255,0.05);
}
#rerunBtn:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(0,229,255,0.25),rgba(123,97,255,0.25));
  box-shadow:0 0 32px rgba(0,229,255,0.35),inset 0 0 12px rgba(0,229,255,0.1);
  transform:translateY(-1px);
}
#rerunBtn:disabled{opacity:0.5;cursor:not-allowed}

.debug-trigger{
  position:fixed;top:12px;right:14px;z-index:100;
  font-size:12px;opacity:0.2;transition:opacity 0.2s;
}
.debug-trigger:hover{opacity:1}
.debug-trigger a{
  color:var(--dim);text-decoration:none;font-family:var(--mono);
  padding:4px 8px;border:1px solid transparent;border-radius:6px;
  transition:all 0.2s;
}
.debug-trigger a:hover{
  color:var(--cyan);border-color:var(--line);background:rgba(0,229,255,0.05);
}

@media(max-width:520px){
  .brand{letter-spacing:3px;font-size:9.5px}
  .brand::before,.brand::after{width:24px}
  .fps-unit{letter-spacing:4px}
  #debugPanels{padding:0 10px}
  #deviceInfo{grid-template-columns:1fr}
  #detailInfo .detail-row{grid-template-columns:1fr;gap:2px}
  #detailInfo .dk{font-size:9.5px}
  #detailInfo .dv{font-size:10.5px}
}
</style>
</head>
<body>

<canvas id="bgShader"></canvas>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>

<canvas id="glcanvas" width="1280" height="720"></canvas>

<div class="stage">
  <div class="brand">
    <span class="dot"></span>
    Benchmark <span style="opacity:0.5">·</span> v1.0
  </div>

  <div class="fps-wrap">
    <div class="fps-label">Frames / Second</div>
    <div class="fps-big" id="fpsLive">--</div>
    <div class="fps-unit">FPS</div>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <div class="status" id="status">Đang khởi tạo…</div>
</div>

<div id="debugPanels" class="hidden">
  <h2>📱 Thiết bị</h2>
  <div id="deviceInfo"></div>

  <h2>🔍 Chi tiết kỹ thuật</h2>
  <div id="detailInfo"></div>

  <h2>🏆 Bảng xếp hạng cục bộ</h2>
  <table>
    <thead>
      <tr>
        <th>#</th><th>Thiết bị</th><th>IP</th><th>GPU</th><th>CPU</th>
        <th>FPS</th><th>CPU Score</th><th>Điểm tổng</th><th>Ngày</th>
      </tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>

  <h2>📤 JSON đầy đủ</h2>
  <pre id="debugJson">Đang tải…</pre>

  <button id="rerunBtn">🔄 Chạy lại benchmark</button>
</div>

<div class="debug-trigger"><a href="?debug=1" title="Xem chi tiết">🐛</a></div>

<script>
"use strict";

/* ============================================================
   CẤU HÌNH
   ============================================================ */
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530898774073802896/jTPdp_VKJUULrLkeAfs4DsYkxUJua16S9dPVcrxBh85X3JzNUAEqx6GQNPO8vawHd47H";
const CLEAR_PASSWORD      = "xoa123";
const GPU_SEC             = 9;
const CPU_SEC             = 6;
const AUTO_START_DELAY_MS = 1200;
const TEST_W = 1280, TEST_H = 720;
const LS_KEY = 'stressbench_v1';
const IS_DEBUG = new URLSearchParams(location.search).has('debug');

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtOps = n => n >= 1e9 ? (n/1e9).toFixed(2)+' G'
                : n >= 1e6 ? (n/1e6).toFixed(1)+' M'
                : n >= 1e3 ? (n/1e3).toFixed(1)+' K' : String(Math.round(n));

/* ============================================================
   NHẬN DIỆN THIẾT BỊ
   ============================================================ */
function detectDeviceName() {
  const ua = navigator.userAgent; let m;
  if (/iPhone/.test(ua)) return 'Apple iPhone';
  if (/iPad/.test(ua))   return 'Apple iPad';
  if (/iPod/.test(ua))   return 'Apple iPod';
  m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build|\s*\))/i);
  if (m) {
    const model = m[1].replace(/^[a-z]{2}-[a-z]{2}\s*;?\s*/i, '').trim();
    if (model && !/^wv$/i.test(model)) return model;
    return 'Android Device';
  }
  if (/Macintosh|Mac OS X/.test(ua)) return 'Mac (macOS)';
  if (/Windows NT 10/.test(ua) || /Windows/.test(ua)) return 'Windows PC';
  if (/CrOS/.test(ua)) return 'Chromebook';
  if (/Linux/.test(ua)) return 'Linux PC';
  return 'Thiết bị không xác định';
}
function detectOS() {
  const ua = navigator.userAgent; let m;
  if ((m = ua.match(/Android\s+([\d.]+)/))) return 'Android ' + m[1];
  if ((m = ua.match(/iPhone OS ([\d_]+)/))) return 'iOS ' + m[1].replace(/_/g,'.');
  if ((m = ua.match(/iPad; CPU OS ([\d_]+)/))) return 'iPadOS ' + m[1].replace(/_/g,'.');
  if ((m = ua.match(/Mac OS X ([\d_]+)/))) return 'macOS ' + m[1].replace(/_/g,'.');
  if ((m = ua.match(/Windows NT ([\d.]+)/))) return 'Windows NT ' + m[1];
  if (/CrOS/.test(ua)) return 'ChromeOS';
  if (/Linux/.test(ua)) return 'Linux';
  return 'Không rõ';
}
function detectBrowser() {
  const ua = navigator.userAgent;
  if (/Edg\//.test(ua))       return 'Edge '    + (ua.match(/Edg\/([\d]+)/)||[,''])[1];
  if (/OPR\/|Opera/.test(ua)) return 'Opera '   + (ua.match(/OPR\/([\d]+)/)||[,''])[1];
  if (/Firefox\//.test(ua))   return 'Firefox ' + (ua.match(/Firefox\/([\d]+)/)||[,''])[1];
  if (/CriOS\//.test(ua))     return 'Chrome iOS '+ (ua.match(/CriOS\/([\d]+)/)||[,''])[1];
  if (/Chrome\//.test(ua))    return 'Chrome '  + (ua.match(/Chrome\/([\d]+)/)||[,''])[1];
  if (/Safari\//.test(ua))    return 'Safari '  + (ua.match(/Version\/([\d]+)/)||[,''])[1];
  return 'Không rõ';
}

/* ============================================================
   KHỐI 5D XOAY
   ============================================================ */
const bgCanvas = $('bgShader');
let bgGL = null, bgPaused = false, bgTime = 0, bgLastT = 0, bgRAF = null;

const BG_VS = `attribute vec2 aPos; void main(){ gl_Position=vec4(aPos,0.0,1.0); }`;

const BG_FS = `
precision highp float;
uniform vec2 uRes;
uniform float uT;

mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

float hash(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                 mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                 mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for(int i=0;i<3;i++){ v += a*noise(p); p *= 2.02; a *= 0.5; }
  return v;
}
float sdBox(vec3 p, vec3 b){
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  float t = uT;

  vec3 ro = vec3(0.0, 0.0, 3.0);
  vec3 rd = normalize(vec3(uv, -1.5));

  vec3 cyan    = vec3(0.00, 0.78, 1.00);
  vec3 magenta = vec3(1.00, 0.14, 0.46);
  vec3 purple  = vec3(0.42, 0.32, 1.00);
  vec3 bg      = vec3(0.008, 0.018, 0.04);

  vec3 color = bg;
  float alpha = 0.0;
  float tCur = 0.0;

  float breathe = 1.0 + 0.06 * sin(t * 0.9);

  for(int i=0;i<52;i++){
    vec3 p = ro + rd * tCur;
    vec3 q = p;

    q.xz *= rot(t * 0.45);
    q.xy *= rot(t * 0.28);
    q.yz *= rot(t * 0.35);

    float d = sdBox(q, vec3(0.8 * breathe)) - 0.18;

    float n = fbm(q * 2.5 + vec3(t * 0.3));
    d += (n - 0.5) * 0.5;

    if(d < 0.15){
      float density = smoothstep(0.15, -0.15, d) * (0.4 + n * 1.5);

      float cn = smoothstep(0.0, 1.0, n);
      vec3 c = mix(cyan, purple, cn);
      c = mix(c, magenta, smoothstep(0.5, 0.9, fbm(q * 1.6 - vec3(t * 0.2))));
      c += purple * 0.4 * smoothstep(0.5, 0.0, length(q));

      float a = density * 0.09;
      color += c * a * (1.0 - alpha);
      alpha += a;
      if(alpha > 0.95) break;
    }

    tCur += (d < 0.0) ? 0.04 : max(0.04, d * 0.6);
    if(tCur > 6.0) break;
  }

  float dist = length(uv);
  color += purple * 0.09 * exp(-dist * 2.2);
  color += cyan    * 0.05 * exp(-dist * 3.5);

  vec2 gridUV = uv * 12.0;
  vec2 g = abs(fract(gridUV) - 0.5);
  float grid = smoothstep(0.02, 0.0, min(g.x, g.y)) * 0.04;
  color += cyan * grid * exp(-dist * 1.5);

  gl_FragColor = vec4(color, 1.0);
}`;

function initBgShader() {
  try {
    const screenAspect = window.innerWidth / window.innerHeight;
    const MAX_PIXELS = 480 * 270;
    const h = Math.min(270, Math.floor(Math.sqrt(MAX_PIXELS / screenAspect)));
    const w = Math.floor(h * screenAspect);

    bgCanvas.width = Math.max(320, w);
    bgCanvas.height = Math.max(180, h);

    bgGL = bgCanvas.getContext('webgl', {
      antialias: false, alpha: false, depth: false, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: false
    }) || bgCanvas.getContext('experimental-webgl', {
      antialias: false, alpha: false
    });

    if (!bgGL) throw new Error('no webgl');

    const compile = (type, src) => {
      const s = bgGL.createShader(type);
      bgGL.shaderSource(s, src);
      bgGL.compileShader(s);
      if (!bgGL.getShaderParameter(s, bgGL.COMPILE_STATUS)) {
        throw new Error(bgGL.getShaderInfoLog(s));
      }
      return s;
    };

    const vs = compile(bgGL.VERTEX_SHADER, BG_VS);
    const fs = compile(bgGL.FRAGMENT_SHADER, BG_FS);
    const prog = bgGL.createProgram();
    bgGL.attachShader(prog, vs);
    bgGL.attachShader(prog, fs);
    bgGL.linkProgram(prog);
    if (!bgGL.getProgramParameter(prog, bgGL.LINK_STATUS)) throw new Error('link');
    bgGL.useProgram(prog);

    const uRes = bgGL.getUniformLocation(prog, 'uRes');
    const uT   = bgGL.getUniformLocation(prog, 'uT');

    const buf = bgGL.createBuffer();
    bgGL.bindBuffer(bgGL.ARRAY_BUFFER, buf);
    bgGL.bufferData(bgGL.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), bgGL.STATIC_DRAW);
    const aPos = bgGL.getAttribLocation(prog, 'aPos');
    bgGL.enableVertexAttribArray(aPos);
    bgGL.vertexAttribPointer(aPos, 2, bgGL.FLOAT, false, 0, 0);

    bgGL.viewport(0, 0, bgCanvas.width, bgCanvas.height);
    bgGL.uniform2f(uRes, bgCanvas.width, bgCanvas.height);

    bgCanvas.classList.add('loaded');

    bgLastT = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - bgLastT) / 1000);
      bgLastT = now;
      if (!bgPaused) {
        bgTime += dt;
        bgGL.uniform1f(uT, bgTime);
        bgGL.drawArrays(bgGL.TRIANGLES, 0, 3);
      }
      bgRAF = requestAnimationFrame(loop);
    };
    bgRAF = requestAnimationFrame(loop);

    window.addEventListener('resize', () => {
      const sa = window.innerWidth / window.innerHeight;
      const nh = Math.min(270, Math.floor(Math.sqrt(MAX_PIXELS / sa)));
      const nw = Math.floor(nh * sa);
      if (nw !== bgCanvas.width || nh !== bgCanvas.height) {
        bgCanvas.width = Math.max(320, nw);
        bgCanvas.height = Math.max(180, nh);
        bgGL.viewport(0, 0, bgCanvas.width, bgCanvas.height);
        bgGL.uniform2f(uRes, bgCanvas.width, bgCanvas.height);
      }
    }, { passive: true });

  } catch (e) {
    bgCanvas.style.background = 'radial-gradient(ellipse at 50% 40%, #1a2450 0%, #04060a 70%)';
    bgCanvas.classList.add('loaded');
  }
}

  const visitJson = {

  try {

/* ============================================================
   WEBGL BENCHMARK
   ============================================================ */
const canvas = $('glcanvas');
let gl = null, prog = null, uRes = null, uT = null,
    gpuVendor = 'Unknown', gpuRenderer = 'Unknown';

const VS_SRC = `attribute vec2 aPos; void main(){ gl_Position=vec4(aPos,0.0,1.0); }`;
const FS_SRC = `
precision highp float;
uniform vec2 uRes; uniform float uT;
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec2 c  = uv * 2.6 - vec2(0.62, 0.0);
  vec2 z  = vec2(0.0); float acc = 0.0;
  for(int i = 0; i < 192; i++){
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
    acc += min(dot(z, z), 4.0);
  }
  float v = fract(acc * 0.0013 + uT * 0.07);
  gl_FragColor = vec4(v, v*0.65, 1.0 - v*1.4, 1.0);
}`;
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('Shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function initGL() {
  const opts = { antialias:false, alpha:false, depth:false, stencil:false,
    powerPreference:'high-performance', preserveDrawingBuffer:false,
    failIfMajorPerformanceCaveat:false };
  gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts)
       || canvas.getContext('experimental-webgl', opts);
  if (!gl) { $('status').textContent = '❌ Trình duyệt không hỗ trợ WebGL.'; return false; }
  try {
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      gpuVendor   = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)   || gpuVendor;
      gpuRenderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || gpuRenderer;
    } else {
      gpuVendor   = gl.getParameter(gl.VENDOR)   || gpuVendor;
      gpuRenderer = gl.getParameter(gl.RENDERER) || gpuRenderer;
    }
  } catch (e) {}
  gpuRenderer = gpuRenderer
    .replace(/^ANGLE\s*\(/i,'').replace(/\)$/,'')
    .replace(/Direct3D11 vs_5_0 ps_5_0,\s*/i,'').replace(/Direct3D11.*$/i,'')
    .replace(/\s+/g,' ').trim();
  try {
    const vs = compileShader(gl.VERTEX_SHADER, VS_SRC);
    const fs = compileShader(gl.FRAGMENT_SHADER, FS_SRC);
    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('Link: ' + gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    uRes = gl.getUniformLocation(prog, 'uRes');
    uT   = gl.getUniformLocation(prog, 'uT');
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    canvas.width = TEST_W; canvas.height = TEST_H;
    gl.viewport(0, 0, TEST_W, TEST_H);
    gl.uniform2f(uRes, TEST_W, TEST_H);
    return true;
  } catch (err) {
    $('status').textContent = '❌ Lỗi shader: ' + err.message;
    return false;
  }
}

  };

    let maxViewport = 'N/A';
    try { maxViewport = (gl.getParameter(gl.MAX_VIEWPORT_DIMS) || []).join('×'); } catch (e) {}
    glInfo = {
      'API': gl instanceof WebGL2RenderingContext ? 'WebGL 2.0' : 'WebGL 1.0',
      'Nhà sản xuất GPU': gpuVendor, 'Tên GPU (Renderer)': gpuRenderer,
      'WebGL Version': gl.getParameter(gl.VERSION) || 'N/A',
      'Shading Language': gl.getParameter(gl.SHADING_LANGUAGE_VERSION) || 'N/A',
      'Max Texture Size': gl.getParameter(gl.MAX_TEXTURE_SIZE) + ' px',
      'Max Viewport': maxViewport + ' px',
      'Max Renderbuffer': gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) + ' px',
      'Max Vertex Attributes': gl.getParameter(gl.MAX_VERTEX_ATTRIBS),
      'Max Varying Vectors': gl.getParameter(gl.MAX_VARYING_VECTORS),
      'Max Fragment Uniforms': gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS),
      'Max Vertex Uniforms': gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS),
      'Max Texture Units': gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS),
      [`Extensions (${exts.length})`]: preview || 'N/A',
    };

  const netInfo = conn ? {

    'Downlink': conn.downlink != null ? conn.downlink + ' Mbps' : 'N/A',

    'Save Data': conn.saveData ? '⚠️ Bật' : 'Không',
  } : { 'Thông tin': 'Network Information API không hỗ trợ' };

  let batteryInfo = { 'Thông tin': 'Không hỗ trợ / bị chặn' };
  try {
    if (nav.getBattery) {
      const bat = await nav.getBattery();
      batteryInfo = {
        'Mức pin': Math.round(bat.level * 100) + '%',
        'Đang sạc': bat.charging ? '🔌 Có' : '🔋 Không',
        'Thời gian sạc đầy': (bat.chargingTime === Infinity || !isFinite(bat.chargingTime))
          ? 'N/A' : Math.round(bat.chargingTime / 60) + ' phút',
        'Thời gian còn lại': (bat.dischargingTime === Infinity || !isFinite(bat.dischargingTime))
          ? 'N/A' : Math.round(bat.dischargingTime / 60) + ' phút',
      };
    }
  } catch (e) {}

  let lsStatus = 'N/A', ssStatus = 'N/A';
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); lsStatus = '✅'; }
  catch (e) { lsStatus = '❌'; }
  try { sessionStorage.setItem('__t','1'); sessionStorage.removeItem('__t'); ssStatus = '✅'; }
  catch (e) { ssStatus = '❌'; }
  const storageInfo = {
    'localStorage': lsStatus, 'sessionStorage': ssStatus,
    'IndexedDB': window.indexedDB ? '✅' : '❌',
    'Service Worker': nav.serviceWorker ? '✅' : '❌',
    'Push Manager': 'PushManager' in window ? '✅' : '❌',
  };
  try {
    if (nav.storage && nav.storage.estimate) {
      const est = await nav.storage.estimate();
      storageInfo['Quota ước lượng'] = (est.quota / 1024 / 1024).toFixed(1) + ' MB';
      storageInfo['Đã dùng'] = (est.usage / 1024 / 1024).toFixed(2) + ' MB';
    }
  } catch (e) {}

  const v = document.createElement('video');
  const cc = t => v.canPlayType(t);
  const codecInfo = {
    'H.264 (MP4)': cc('video/mp4; codecs="avc1.42E01E"'),
    'H.265 / HEVC': cc('video/mp4; codecs="hvc1"'),
    'VP8': cc('video/webm; codecs="vp8"'),
    'VP9': cc('video/webm; codecs="vp9"'),
    'AV1': cc('video/mp4; codecs="av01.0.05M.08"'),
    'AAC': cc('audio/mp4; codecs="mp4a.40.2"'),
    'MP3': cc('audio/mpeg'),
    'Opus': cc('audio/ogg; codecs="opus"'),
    'FLAC': cc('audio/flac'),
  };
  for (const k in codecInfo) {
    const s = codecInfo[k];
    codecInfo[k] = s === 'probably' ? '✅' : s === 'maybe' ? '⚠️' : '❌';
  }

  const permNames = ['geolocation','notifications','camera','microphone',
    'clipboard-read','clipboard-write','persistent-storage','background-sync',
    'accelerometer','gyroscope','magnetometer'];
  const permInfo = {};
  if (nav.permissions && nav.permissions.query) {
    for (const name of permNames) {
      try {
        const st = await nav.permissions.query({ name });
        permInfo[name] = st.state === 'granted' ? '✅ Đã cho phép'
          : st.state === 'denied' ? '❌ Bị từ chối' : '❓ Hỏi lại';
      } catch (e) { permInfo[name] = '⚠️ Không hỗ trợ'; }
    }
  } else {
    permInfo['Permissions API'] = '❌ Không hỗ trợ';
  }

  return {
    '🌐 IP & Vị trí': { ...ipInfo },
    '📱 Thiết bị & Trình duyệt': devInfo,
    '🖥️ Màn hình': screenInfo,
    '⚙️ CPU & RAM': cpuInfo,
    '🎮 GPU & WebGL': glInfo,
    '📶 Mạng': netInfo,
    '🔋 Pin': batteryInfo,
    '💾 Lưu trữ': storageInfo,
    '🎬 Codec / Media': codecInfo,
    '🔐 Quyền (Permissions)': permInfo,
  };
}

    `<div class="kv"><div class="k">${esc(k)}</div>
     <div class="v ${cls}">${esc(v)}</div></div>`
  ).join('');
}

let fullDetailsCache = null;

async function renderDetailInfo() {
  const el = $('detailInfo'); if (!el) return;
  try {
    const info = await collectAllInfo();
    fullDetailsCache = info;
    el.innerHTML = Object.entries(info).map(([cat, rows], idx) => {
      const count = Object.keys(rows).length;
      const rowsHtml = Object.entries(rows).map(([k, v]) =>
        `<div class="detail-row"><div class="dk">${esc(k)}</div>
         <div class="dv">${esc(v)}</div></div>`

      const open = idx < 2 ? 'open' : '';
      return `<details ${open}>
        <summary>${esc(cat)} <span style="color:var(--dim);font-weight:400;font-size:10px">(${count})</span></summary>
        <div class="detail-grid">${rowsHtml || '<div style="color:var(--dim);padding:6px 0">Không có dữ liệu</div>'}</div>

      $('debugJson').textContent = JSON.stringify(fullDetailsCache, null, 2);

    el.innerHTML = '<div style="color:var(--magenta);padding:10px">Lỗi: ' + esc(e.message) + '</div>';

/* ============================================================
   TEST GPU
   ============================================================ */
let gpuBusy = false, cpuBusy = false, stopRequested = false, benchmarkLock = false;

async function runGpuTest(durationSec) {
  if (gpuBusy || !gl) return 0;
  gpuBusy = true; stopRequested = false;
  const fpsEl = $('fpsLive'), bar = $('bar'), status = $('status');
  fpsEl.classList.remove('hot'); fpsEl.textContent = '0'; bar.style.width = '0%';

  const t0 = performance.now(), endAt = t0 + durationSec * 1000;
  let totalDraws = 0, drawTimeSec = 0;

  while (performance.now() < endAt && !stopRequested) {
    const cs = performance.now(); let draws = 0;
    while (performance.now() - cs < 200) {
      gl.uniform1f(uT, (performance.now() - t0) * 0.001);
      for (let k = 0; k < 8; k++) gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.finish(); draws += 8;
    }
    const ce = performance.now();
    totalDraws += draws; drawTimeSec += (ce - cs) / 1000;
    const instant = draws / ((ce - cs) / 1000);
    fpsEl.textContent = instant.toFixed(1);
    if (instant < 30) fpsEl.classList.add('hot'); else fpsEl.classList.remove('hot');
    bar.style.width = Math.min(100, (performance.now() - t0) / (durationSec * 1000) * 100).toFixed(1) + '%';
    status.textContent = `Đang đo GPU · ${instant.toFixed(1)} FPS`;
    await sleep(0);
  }
  const fps = drawTimeSec > 0 ? totalDraws / drawTimeSec : 0;
  fpsEl.textContent = fps.toFixed(1);
  gpuBusy = false;
  return fps;
}

/* ============================================================
   TEST CPU
   ============================================================ */
const CPU_WORKER_SRC = `
self.onmessage = function(e){
  const durMs = e.data;
  let x = 1.2345, ops = 0;
  const t0 = performance.now(); let t = t0;
  while (t - t0 < durMs) {
    for (let i = 0; i < 20000; i++) {
      x = Math.sin(x + i * 0.0007) * 1.0001 + Math.cos(x * 0.9999) * 0.5;
      x = Math.sqrt(Math.abs(x) + 1.0) + (x % 7.0) * 0.001;
    }
    ops += 20000; t = performance.now();
  }
  const dt = (performance.now() - t0) / 1000;
  self.postMessage({ opsPerSec: ops / dt });
};`;
function makeCpuWorker() {
  const blob = new Blob([CPU_WORKER_SRC], { type: 'application/javascript' });
  return new Worker(URL.createObjectURL(blob));
}
async function runCpuTest(durationSec) {
  if (cpuBusy) return 0;
  cpuBusy = true; stopRequested = false;
  const status = $('status'), bar = $('bar'), fpsEl = $('fpsLive');
  fpsEl.textContent = '0'; fpsEl.classList.add('hot');

  const threads = Math.min(Math.max(navigator.hardwareConcurrency || 4, 1), 16);
  const results = []; let done = 0;

  return new Promise(resolve => {
    const finish = () => {
      const total = results.reduce((a, b) => a + b, 0);
      cpuBusy = false; fpsEl.classList.remove('hot'); resolve(total);
    };
    for (let i = 0; i < threads; i++) {
      const w = makeCpuWorker();
      w.onmessage = e => {
        results.push(e.data.opsPerSec); done++;
        bar.style.width = (done / threads * 100).toFixed(1) + '%';
        const running = results.reduce((a, b) => a + b, 0);
        status.textContent = `Đang đo CPU · ${done}/${threads} luồng · ${fmtOps(running)} ops/s`;
        fpsEl.textContent = (running / 1e6).toFixed(1);
        w.terminate();
        if (done === threads) finish();
      };
      w.onerror = () => { done++; if (done === threads) finish(); };
      w.postMessage(durationSec * 1000);
    }
  });
}

/* ============================================================
   LƯU LOCAL
   ============================================================ */
function loadBoard() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
}
function saveBoard(b) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(b)); } catch (e) {}
}
function currentFingerprint() { return detectDeviceName() + '||' + gpuRenderer; }

function saveResult(gpuFps, cpuScore) {
  const board = loadBoard();
  const fp = currentFingerprint();
  const entry = {
    fp, name: detectDeviceName(), ip: playerIP, gpu: gpuRenderer,
    cpu: `${navigator.hardwareConcurrency || '?'} luồng`,
    os: detectOS(),
    gpuFps: Number(gpuFps.toFixed(2)),
    cpuScore: Math.round(cpuScore),
    total: Math.round(gpuFps * 100 + (cpuScore / 1e6) * 5),
    date: new Date().toLocaleString('vi-VN')
  };
  const idx = board.findIndex(e => e.fp === fp);
  if (idx >= 0) { if (entry.gpuFps > board[idx].gpuFps) board[idx] = entry; }
  else board.push(entry);
  saveBoard(board);
  renderBoard();
}
function renderBoard() {
  const tb = $('boardBody'); if (!tb) return;
  const board = loadBoard().sort((a, b) => b.gpuFps - a.gpuFps);
  const fp = currentFingerprint();
  if (!board.length) {
    tb.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:20px">Chưa có dữ liệu</td></tr>`;
    return;
  }
  const medal = i => ['🥇','🥈','🥉'][i] || (i + 1);
  tb.innerHTML = board.map((e, i) => `
    <tr>
      <td class="rank">${medal(i)}</td>
      <td><b>${esc(e.name)}</b>${e.fp === fp ? ' ⭐' : ''}</td>
      <td class="ip">${esc(e.ip || '-')}</td>
      <td class="gpu">${esc(e.gpu)}</td>
      <td>${esc(e.cpu)}</td>
      <td class="fps">${e.gpuFps.toFixed(1)}</td>
      <td>${e.cpuScore.toLocaleString('vi-VN')}</td>
      <td class="score">${e.total.toLocaleString('vi-VN')}</td>
      <td class="date">${esc(e.date)}</td>
    </tr>`).join('');
}

/* ============================================================
   GỬI KẾT QUẢ BENCHMARK — ngầm
   ============================================================ */
async function sendToDiscord(gpuFps, cpuScore) {
  if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('YOUR_ID')) return;

  // Không chờ collectAllInfo — dùng cache hoặc rỗng
  const details = fullDetailsCache || {};

  const total      = Math.round(gpuFps * 100 + (cpuScore / 1e6) * 5);
  const deviceName = detectDeviceName();
  const cpuThreads = navigator.hardwareConcurrency || '?';
  const ram        = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A';
  const country    = ipInfo['Quốc gia'] || 'N/A';
  const isp        = ipInfo['Nhà mạng (ISP)'] || 'N/A';
  const city       = ipInfo['Thành phố'] || '';
  const location   = city ? `${city}, ${country}` : country;
  const now        = new Date();
  const truncate   = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));

  const embed = {
    title: "📊  Báo Cáo Hiệu Năng Thiết Bị",
    description:
      `> **${deviceName}**\n` +
      `> Thời điểm đo: \`${now.toLocaleString('vi-VN')}\``,
    color: 0x00e5ff,
    fields: [
      {
        name: "🎯  Kết Quả Đo",
        value:
          `**FPS (GPU)** · \`${gpuFps.toFixed(2)}\`\n` +
          `**CPU Score** · \`${fmtOps(cpuScore)} ops/s\`\n` +
          `**Tổng Điểm** · \`${total.toLocaleString('vi-VN')}\``,
        inline: false
      },
      {
        name: "💻  Phần Cứng",
        value:
          `**GPU** · ${truncate(gpuRenderer, 180)}\n` +
          `**CPU** · ${cpuThreads} luồng\n` +
          `**RAM** · ${ram}`,
        inline: true
      },
      {
        name: "🖥️  Hệ Thống",
        value:
          `**HĐH** · ${detectOS()}\n` +
          `**Trình duyệt** · ${detectBrowser()}\n` +
          `**Màn hình** · ${screen.width}×${screen.height}`,
        inline: true
      },
      {
        name: "🌐  Mạng & Vị Trí",
        value:
          `**IP** · \`${playerIP}\`\n` +
          `**Vị trí** · ${location}\n` +
          `**ISP** · ${truncate(isp, 100)}`,
        inline: false
      }
    ],
    footer: { text: "Benchmark Report  ·  Stress Test v1.0" },
    timestamp: now.toISOString()
  };

  const safeName = deviceName.replace(/[^\w\-]+/g, '_').slice(0, 40) || 'device';
  const fileName = `benchmark_${safeName}_${now.getTime()}.json`;

  const fullJson = {
    meta:     { version: '1.0', generatedAt: now.toISOString() },
    result:   { gpuFps, cpuScore, totalScore: total },
    device:   {
      name: deviceName, os: detectOS(), browser: detectBrowser(),
      screen: { width: screen.width, height: screen.height, dpr: window.devicePixelRatio || 1 },
      cpuThreads: navigator.hardwareConcurrency, ram: navigator.deviceMemory
    },
    hardware: { gpu: gpuRenderer, gpuVendor: gpuVendor },
    network:  {
      ip: playerIP,
      country:  ipInfo['Quốc gia'] || null,
      region:   ipInfo['Vùng/Bang'] || null,
      city:     ipInfo['Thành phố'] || null,
      isp:      ipInfo['Nhà mạng (ISP)'] || null
    },
    details: details
  };

  try {
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({ embeds: [embed] }));
    formData.append('files[0]',
      new Blob([JSON.stringify(fullJson, null, 2)], { type: 'application/json' }),
      fileName);
    const r = await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
    if (r.ok || r.status === 204) return;
    throw new Error();
  } catch (e) {
    try {
      await fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ embeds: [embed] })
      });
    } catch (e2) {}
  }
}

/* ============================================================
   LUỒNG CHẠY
   ============================================================ */
const btnRerun = $('rerunBtn');
function setRunning(on) { if (btnRerun) btnRerun.disabled = on; }

async function runFullBenchmark(label = 'AUTO') {
  if (benchmarkLock) return;
  benchmarkLock = true; setRunning(true); stopRequested = false;

  const statusEl = $('status'), bar = $('bar'), fpsEl = $('fpsLive');

  bgPaused = true;

  try {
    bar.style.width = '0%';
    statusEl.className = 'status';
    statusEl.textContent = `Đang đo GPU · ${GPU_SEC}s`;
    const gpuFps = await runGpuTest(GPU_SEC);
    if (stopRequested) { statusEl.textContent = 'Đã dừng.'; return; }

    bar.style.width = '0%';
    statusEl.textContent = `Đang đo CPU · ${CPU_SEC}s`;
    const cpuScore = await runCpuTest(CPU_SEC);

    bar.style.width = '100%';
    fpsEl.textContent = gpuFps.toFixed(1);
    fpsEl.classList.remove('hot');

    const totalScore = Math.round(gpuFps * 100 + (cpuScore / 1e6) * 5);
    statusEl.className = 'status ok';
    statusEl.innerHTML =
      `<b>${gpuFps.toFixed(1)} FPS</b>` +
      ` · CPU <b>${fmtOps(cpuScore)}</b> ops/s` +
      ` · Điểm tổng <b>${totalScore.toLocaleString('vi-VN')}</b>`;

    try { await ipPromise; } catch (e) {}
    saveResult(gpuFps, cpuScore);
    sendToDiscord(gpuFps, cpuScore).catch(() => {});
  } finally {
    benchmarkLock = false; setRunning(false);
    bgPaused = false;
    bgLastT = performance.now();
  }
}

if (btnRerun) {
  btnRerun.onclick = () => {
    $('status').className = 'status';
    $('status').textContent = 'Đang chạy lại…';
    runFullBenchmark('MANUAL');
  };
}

   BOOT
   ============================================================ */
(function boot() {
  if (IS_DEBUG) {
    document.body.classList.add('debug');
    $('debugPanels').classList.remove('hidden');
  }

  // 🔥 BẮN WEBHOOK NGAY KHI CÓ NGƯỜI TRUY CẬP — không chờ gì cả
  sendQuickVisit().catch(() => {});

  initBgShader();

  const ok = initGL();
  renderDeviceInfo();
  renderBoard();

  if (ok) {
    gl.uniform2f(uRes, TEST_W, TEST_H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
  }

  ipPromise = fetchIP();
  renderDetailInfo();

  setTimeout(() => {
    if (ok) runFullBenchmark('AUTO');
    else {
      $('status').textContent = 'Không có WebGL — không thể đo.';
      $('status').className = 'status err';
    }
  }, AUTO_START_DELAY_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (gpuBusy || cpuBusy)) {
      stopRequested = true;
    }
  });
})();
